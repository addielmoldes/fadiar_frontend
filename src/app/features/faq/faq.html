<div class="px-5 lg:px-40 mb-10">
  <div>
    <small class="text-muted">
      <a href="/">Home</a>
      &minus;
    </small>
    <small class="font-bold">FAQ</small>
  </div>

  <h3 class="text-2xl font-bold mb-3">FAQ</h3>

  <div class="flex flex-col lg:flex-row gap-10 mb-4">
    <div class="self-center">
      <h3 class="font-bold text-3xl mb-3">Preguntas Frecuentes<br><span class="text-accent">de nuestros clientes</span>
      </h3>
      <div class="text-muted-foreground font-light">Lorem ipsum Sit amet consectetur. At tristique est adipiscing
        pellentesque vel sit id at
      </div>
    </div>

    <z-accordion zDefaultValue="item-1" class="gap-4">
      @for (question of faq; track $index) {
        <z-accordion-item [zTitle]="question.title"
                          [zValue]="`item-${$count}`"
                          class="bg-slate-100 border-none rounded-xl"
        >
          {{ question.answer }}
        </z-accordion-item>
      }
    </z-accordion>
  </div>

  <app-download-banner/>
</div>

<app-hero-3/>

<div class="px-5 lg:px-40">
  <app-latest-products/>
</div>
