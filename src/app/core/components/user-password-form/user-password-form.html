<form [formGroup]="userPasswordForm" (ngSubmit)="submit()">
  <div class="flex justify-between">
    <h4 class="font-bold mb-5">Contraseña</h4>
    <app-user-submit-button/>
  </div>

  <div class="grid md:grid-cols-2 items-baseline gap-5">
    <z-form-field>
      <label z-form-label zRequired for="current-password-field">Contraseña actual</label>
      <z-form-control>
        <input class="bg-slate-100 px-3"
               formControlName="currentPassword"
               id="current-password-field"
               placeholder="Contraseña"
               type="password"
               z-input
               zBorderless>
      </z-form-control>
      @if (currentPassword.hasError('required') && currentPassword.touched) {
        <z-form-message zType="error">El campo contraseña actual es requerido</z-form-message>
      }
    </z-form-field>

    <z-form-field>
      <label z-form-label zRequired for="password-field">Nueva contraseña</label>
      <z-form-control>
        <input class="bg-slate-100 px-3"
               formControlName="password"
               id="password-field"
               placeholder="Contraseña"
               type="password"
               z-input
               zBorderless>
      </z-form-control>
      @if (password.hasError('required') && password.touched) {
        <z-form-message zType="error">El campo contraseña nueva es requerido</z-form-message>
      }
    </z-form-field>
  </div>
</form>
