<form [formGroup]="userAddressForm" (ngSubmit)="submit()" class="mb-10">
  <div class="flex justify-between">
    <h4 class="font-bold mb-5">Dirección</h4>
    <app-user-submit-button/>
  </div>
  
  <z-form-field>
    <label z-form-label zRequired for="address-field">Dirección</label>
    <z-form-control>
            <textarea class="bg-slate-100 p-3"
                      formControlName="address"
                      id="address-field"
                      placeholder="Dirección"
                      z-input
                      zBorderless>
            </textarea>
    </z-form-control>
    @if (address.hasError('required') && address.touched) {
      <z-form-message zType="error">El campo dirección es requerido</z-form-message>
    }
  </z-form-field>
</form>
