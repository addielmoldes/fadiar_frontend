<div class="py-10">
  <h5 class="font-bold">También le puede interesar</h5>
  <h4 class="font-bold text-accent text-xl mb-4">Productos Relacionados</h4>

  <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-3">
    @for (product of relatedProducts(); track product.id) {
      <app-product [product]="product" layout="horizontal"/>
    }
  </div>
</div>
