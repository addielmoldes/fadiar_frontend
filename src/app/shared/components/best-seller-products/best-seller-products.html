<div class="py-10">
  <h5 class="font-bold">Lo que le gusta a la gente!!!</h5>
  <h4 class="font-bold text-accent text-xl mb-4">Lo más Vendido</h4>

  <div class="mx-auto">
    <z-carousel zControls="dot" [zOptions]="{loop: true, dragFree: true}">
      <z-carousel-content>
        @for (product of bestSellerProducts(); track product.id) {
          <z-carousel-item class="basis-1/2 md:basis-1/3 lg:basis-1/5">
            <app-product [product]="product"/>
          </z-carousel-item>
        }
      </z-carousel-content>
    </z-carousel>
  </div>
</div>
